<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Multimedia</title>
</head>
<body>

    <!-- 1. Título principal -->
    <h1>Mi Portal Multimedia</h1>

    <!-- Navegación con enlace interno -->
    <nav>
        <!-- 5. Enlace interno hacia contacto.html -->
        <a href="contacto.html">Ir a la página de Contacto</a>
    </nav>

    <hr>

    <main>
        <section>
            <h2>Imagen Destacada</h2>
            <!-- 2. Imagen con atributo alt -->
            <img src="https://via.placeholder.com/600x300" alt="Fotografía panorámica de un paisaje al atardecer" width="600" height="300">
        </section>

        <section>
            <h2>Reproductor de Video</h2>
            <!-- 3. Reproductor de video con la etiqueta <video> -->
            <video controls width="640" poster="https://via.placeholder.com/640x360">
                <source src="video-ejemplo.mp4" type="video/mp4">
                Tu navegador no soporta el reproductor de video HTML5.
            </video>
        </section>

        <section>
            <h2>Enlaces de Interés</h2>
            <!-- 4. Enlace externo -->
            <p>Para aprender más sobre desarrollo web, visita la 
                <a href="https://developer.mozilla.org/es/" target="_blank" rel="noopener noreferrer">
                    Documentación de MDN Web Docs
                </a>.
            </p>
        </section>
    </main>

</body>
</html>
